[project]
name = "opencu"
version = "2.0.0"
description = "OpenAgentCU - Windows desktop perception and UIA action bridge"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
oacu = "oacu.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oacu*"]
